# Se instala con `make install` (o `uv run pre-commit install`).
repos:
  - repo: local
    hooks:
      # Primero, y sobre todos los archivos: ningún documento real entra al repo.
      - id: sin-datos-reales
        name: Sin documentos reales (PDFs e imágenes solo en data/synthetic/ y docs/img/)
        entry: python scripts/check_no_real_data.py
        language: python

      # Ruff corre desde el entorno de uv, con la versión fijada en uv.lock (la misma que CI).
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
