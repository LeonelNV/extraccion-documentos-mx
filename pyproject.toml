[project]
name = "docextract"
version = "0.1.0"
description = "Extracción automática de datos de documentos oficiales mexicanos (CURP, INE, CSF y comprobante de domicilio) con datos sintéticos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LeonelNV" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "rapidfuzz>=3.9,<4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.8",
]
synth = [
    "faker>=30,<40",
    "numpy>=2.0,<3",
    "pillow>=10.4,<12",
    "pypdfium2>=4.30,<6",
    "reportlab>=4.2,<5",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

# `uv sync` instala también el generador sintético: sus pruebas corren en CI.
[tool.uv]
default-groups = ["dev", "synth"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle (advertencias)
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # reglas propias de ruff
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["scripts", "."]  # "." para importar el paquete synth/
addopts = ["-ra", "--strict-markers", "--doctest-modules"]
